[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e-witness"
version = "0.1.0"
description = "High-assurance multi-department incident reporting, digital evidence custody, and investigation platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "E-WITNESS Engineering & Security Team" }
]
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "fastapi==0.143.0",
    "greenlet==3.5.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.22.1",
    "coverage==7.16.2",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ai_services*"]

# =============================================================================
# Ruff Configuration (Formatter & Linter)
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "ai_services", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort import sorting
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit security checks
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501", # Line length handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # Use of assert is standard in pytest
    "S105", # Hardcoded dummy test secret strings in test fixtures
    "S106", # Hardcoded dummy test secret arguments in test fixtures
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "ai_services"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# =============================================================================
# Mypy Static Type Checking Configuration
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["backend", "ai_services", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# =============================================================================
# Pytest & Coverage Configuration
# =============================================================================
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=backend/app",
    "--cov=ai_services",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
markers = [
    "unit: fast isolated unit tests without HTTP transport",
    "integration: ASGI API integration and middleware pipeline tests",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["backend/app", "ai_services"]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
