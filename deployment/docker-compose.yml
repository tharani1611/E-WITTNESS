# =============================================================================
# E-WITNESS Production Docker Compose Architecture
# Phase 108: Container & Supply-Chain Security Hardening
#
# Security Controls:
# - Strict internal network isolation (database and cache not exposed externally)
# - Resource limits (CPU/Memory) on all containers to prevent resource exhaustion
# - Standardized health checks on all dependent infrastructure services
# - Read-only root filesystems where applicable with tmpfs mounts
# - Mandatory secrets injection via environment variables or secret files
# =============================================================================

version: "3.8"

networks:
  ewitness_internal:
    driver: bridge
    internal: true
  ewitness_public:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Application API Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: ewitness/backend:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - ewitness_internal
      - ewitness_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - APP_NAME=E-WITNESS
      - APP_VERSION=0.1.0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - STORAGE_BACKEND=s3
      - STORAGE_ENDPOINT_URL=http://minio:9000
      - STORAGE_BUCKET_NAME=${STORAGE_BUCKET_NAME:-ewitness-evidence}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ENFORCE_SSL=true
      - SECURITY_HEADERS_ENABLED=true
      - BIOMETRIC_MATCHING_ENABLED=false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 2. PostgreSQL 16 Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - ewitness_internal
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ewitness_prod}
      - POSTGRES_USER=${POSTGRES_USER:-ewitness_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ewitness_admin} -d ${POSTGRES_DB:-ewitness_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3. Redis 7 Cache & Rate Limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--protected-mode", "yes"]
    networks:
      - ewitness_internal
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # 4. S3-Compatible Object Storage (MinIO)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks:
      - ewitness_internal
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - storage_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
