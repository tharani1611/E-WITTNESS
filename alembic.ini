# =============================================================================
# E-WITNESS — Alembic Migration Configuration (Phase 13)
# =============================================================================
# SECURITY NOTE:
# Never hardcode database credentials in `alembic.ini`.
# `sqlalchemy.url` is intentionally left blank here and resolved dynamically by
# `backend/migrations/env.py` from the validated `Settings` module (`DATABASE_URL`).
# =============================================================================

[alembic]
script_location = backend/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC
truncate_slug_length = 40
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
